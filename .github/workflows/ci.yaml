name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Fork of wagoid/commitlint-github-action. Upstream is unmaintained: no
      # commit to master since 2025-01-14, and it pins @commitlint/ensure ^19,
      # two majors behind. This fork runs commitlint v21 on node 24, and pins its
      # runtime image by digest so the SHA pin here cannot be worked around.
      - uses: yo61/commitlint-github-action@501ff7bb31eb7133c871318c877d0e43cd1ff500  # v6.3.0 (digest-pinned)
        with:
          configFile: commitlint.config.mjs

  validate-plugin-json:
    name: plugin.json validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Validate plugin.json shape
        run: |
          set -euo pipefail
          jq -e '
            (.name | type) == "string" and
            (.version | type) == "string" and
            (.description | type) == "string" and
            (.author == null or (.author | type) == "object") and
            (.author == null or .author.name == null or (.author.name | type) == "string") and
            (.author == null or .author.email == null or (.author.email | type) == "string") and
            (.license == null or (.license | type) == "string") and
            (.homepage == null or (.homepage | type) == "string") and
            (.repository == null or (.repository | type) == "string")
          ' .claude-plugin/plugin.json
      - name: Validate hooks.json shape
        run: |
          set -euo pipefail
          # A malformed hooks.json disables the plugin silently, which is the
          # worst failure mode for a guardrail: it looks installed and enforces
          # nothing. Assert the shape rather than only that it parses.
          jq -e '
            (.hooks | type) == "object" and
            (.hooks.PreToolUse | type) == "array" and
            ([.hooks.PreToolUse[] | .matcher | type] | all(. == "string")) and
            ([.hooks.PreToolUse[].hooks[] | .command | type] | all(. == "string")) and
            ([.hooks.PreToolUse[].hooks[] | .command] | all(startswith("\"${CLAUDE_PLUGIN_ROOT}")))
          ' hooks/hooks.json

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # shfmt is not preinstalled; installing it through Go (which is) at a
      # pinned version avoids taking on another action dependency to SHA-pin
      # and keep updated.
      - name: Install shfmt
        run: |
          set -euo pipefail
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # shellcheck IS preinstalled, and that was the problem: the runner image
      # carries whatever version it carries and the local hook used whatever was
      # installed, so the same construct was reported under different codes --
      # an uncalled function is SC2329 on 0.11 and SC2317 per body line on
      # older builds. A disable written against one of them was clean locally
      # and red here. The version and its checksum live in .shellcheck-version,
      # which the local hook reads too.
      - name: Install shellcheck
        run: |
          set -euo pipefail
          . ./.shellcheck-version
          url=https://github.com/koalaman/shellcheck/releases/download
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "$url/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256_LINUX_X86_64}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 \
            "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

      # Runs every hook in .pre-commit-config.yaml, including the shellcheck
      # version check, shellcheck, shfmt, the test suites and the README
      # counts, so local and CI cannot drift. It runs after the installs above
      # so the local hooks find the pinned binaries first on PATH. commitlint
      # is a commit-msg hook, which --all-files skips; the Conventional Commits
      # job covers it.
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204  # v3.0.1
        env:
          # renovate: datasource=github-releases depName=j178/prek extractVersion=^v(?<version>.+)$
          PREK_VERSION: 0.5.5
        with:
          prek-version: ${{ env.PREK_VERSION }}
