name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Fork of wagoid/commitlint-github-action. Upstream is unmaintained: no
      # commit to master since 2025-01-14, and it pins @commitlint/ensure ^19,
      # two majors behind. This fork runs commitlint v21 on node 24, and pins its
      # runtime image by digest so the SHA pin here cannot be worked around.
      - uses: yo61/commitlint-github-action@501ff7bb31eb7133c871318c877d0e43cd1ff500  # v6.3.0 (digest-pinned)
        with:
          configFile: commitlint.config.mjs

  validate-plugin-json:
    name: plugin.json validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Validate plugin.json shape
        run: |
          set -euo pipefail
          jq -e '
            (.name | type) == "string" and
            (.version | type) == "string" and
            (.description | type) == "string" and
            (.author == null or (.author | type) == "object") and
            (.author == null or .author.name == null or (.author.name | type) == "string") and
            (.author == null or .author.email == null or (.author.email | type) == "string") and
            (.license == null or (.license | type) == "string") and
            (.homepage == null or (.homepage | type) == "string") and
            (.repository == null or (.repository | type) == "string")
          ' .claude-plugin/plugin.json
      - name: Validate hooks.json shape
        run: |
          set -euo pipefail
          # A malformed hooks.json disables the plugin silently, which is the
          # worst failure mode for a guardrail: it looks installed and enforces
          # nothing. Assert the shape rather than only that it parses.
          jq -e '
            (.hooks | type) == "object" and
            (.hooks.PreToolUse | type) == "array" and
            ([.hooks.PreToolUse[] | .matcher | type] | all(. == "string")) and
            ([.hooks.PreToolUse[].hooks[] | .command | type] | all(. == "string")) and
            ([.hooks.PreToolUse[].hooks[] | .command] | all(startswith("\"${CLAUDE_PLUGIN_ROOT}")))
          ' hooks/hooks.json

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # shfmt is not preinstalled; installing it through Go (which is) at a
      # pinned version avoids taking on another action dependency to SHA-pin
      # and keep updated.
      - name: Install shfmt
        run: |
          set -euo pipefail
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # shellcheck IS preinstalled, and that was the problem: the runner image
      # carries whatever version it carries and the local hook used whatever was
      # installed, so the same construct was reported under different codes --
      # an uncalled function is SC2329 on 0.11 and SC2317 per body line on
      # older builds. A disable written against one of them was clean locally
      # and red here. The version and its checksum live in .shellcheck-version,
      # which the local hook reads too.
      - name: Install shellcheck
        run: |
          set -euo pipefail
          . ./.shellcheck-version
          url=https://github.com/koalaman/shellcheck/releases/download
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "$url/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256_LINUX_X86_64}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 \
            "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # Belt and braces: /usr/local/bin must win over the preinstalled copy, or
      # this job silently goes back to linting with the image's version.
      - name: shellcheck version matches the pin
        run: bash tests/shellcheck-version.sh

      # --rcfile, not a search. shellcheck otherwise takes the first
      # .shellcheckrc found from each file upward and then $HOME, so the
      # settings depend on where the checkout sits -- which is how a personal
      # config leaked into local runs and made them disagree with this job.
      - name: shellcheck
        run: shellcheck --rcfile=.shellcheckrc scripts/*.sh tests/*.sh

      # -i 2 -bn -ci -sr is the project standard, matching the local prek hook
      # and the editor, so a file formatted on save passes here unchanged.
      - name: shfmt
        run: shfmt -i 2 -bn -ci -sr -d scripts/*.sh tests/*.sh

      # The suite covers blocked AND allowed forms. The allowed half is the one
      # that matters: a guard that cries wolf gets switched off.
      - name: gate test suite
        run: GATE="$PWD/scripts/lastlight-review-gate.sh" bash tests/lastlight-review-gate.test.sh

      # The attestation check is the security property this plugin is named for,
      # so it gets its own coverage rather than riding on the gate's.
      - name: recorder test suite
        run: RECORD="$PWD/scripts/lastlight-review-record.sh" bash tests/lastlight-review-record.test.sh

      # Pins the isolation policy. The header's hand-verified controls are a
      # comment until something re-runs them.
      - name: sandbox policy suite
        run: SANDBOX="$PWD/scripts/lastlight-sandbox.sh" bash tests/lastlight-sandbox.test.sh

      # The work sandbox is the one script that hands a session Bash AND the
      # file-editing tools against the real filesystem, so a rule quietly
      # dropped here costs more than anywhere else in this repo.
      - name: work sandbox suite
        run: WORK="$PWD/scripts/lastlight-work-sandbox.sh" bash tests/lastlight-work-sandbox.test.sh

      # The orchestrator decides whether the reviewer gets unrestricted Bash and
      # writes the attestation the gate rests on. It was the only one of the
      # four without a suite, and two of its parsing bugs were found by hand.
      - name: review runner suite
        run: RUN="$PWD/scripts/lastlight-review-run.sh" bash tests/lastlight-review-run.test.sh

      # The README promises its counts are what the suites print. Enforced
      # rather than restated: the table went stale twice and a reviewer caught
      # it both times.
      - name: README test counts
        run: bash tests/readme-counts.sh
